apiVersion: blackbeard/v1
kind: Crew
metadata:
  name: research-stage
  project: default
spec:
  description: "First stage: research and gather information"
  process: sequential
  agents:
    - ref:agents/researcher
  tasks:
    - ref:tasks/gather-data
---
apiVersion: blackbeard/v1
kind: Crew
metadata:
  name: publish-stage
  project: default
spec:
  description: "Second stage: format and publish the research"
  process: sequential
  agents:
    - ref:agents/publisher
  tasks:
    - ref:tasks/format-report
