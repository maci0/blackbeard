apiVersion: blackbeard/v1
kind: Crew
metadata:
  name: simple-crew
  namespace: default
spec:
  description: "A simple single-agent crew for quick tasks"
  process: sequential
  inline:
    llm_connections:
      - name: default-llm
        provider: vertex_ai
        model: claude-sonnet-4-6
        parameters:
          temperature: 0.7
    agents:
      - name: assistant
        role: "General Assistant"
        goal: "Help with the given task efficiently and accurately"
        backstory: "You are a helpful, knowledgeable assistant."
        llm: default-llm
    tasks:
      - name: main-task
        description: "{task_description}"
        expected_output: "A clear, helpful response to the task."
        agent: assistant
  agents:
    - assistant
  tasks:
    - main-task
  inputs:
    - name: task_description
      description: "What you want the assistant to do"
      required: true
