map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

log_format privacy '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri HTTP/$server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log privacy;

    include /etc/nginx/security-headers.conf;

    client_max_body_size 10m;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    location /.well-known/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_buffers 4 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 16k;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"API is temporarily unavailable"}';
    }

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml
               image/svg+xml application/wasm;
    gzip_min_length 256;
}
