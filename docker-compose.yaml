x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── API (FastAPI backend) ──────────────────────────────────────────────────
  api:
    build:
      context: backend/
      dockerfile: ../deploy/docker/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackbeard:blackbeard@postgres:5432/blackbeard}
      VALKEY_URL: ${VALKEY_URL:-valkey://default:valkey-dev-secret@valkey:6379/0}
      LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      BLACKBEARD_API_KEY: ${BLACKBEARD_API_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-deploy/docker/empty-credentials.json}:/app/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: 2g
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [frontend, backend]

  # ── UI (React/Vite frontend) ───────────────────────────────────────────────
  ui:
    build:
      context: frontend/
      dockerfile: ../deploy/docker/Dockerfile.ui
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    networks: [frontend]

  # ── PostgreSQL 18 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: blackbeard
      POSTGRES_PASSWORD: blackbeard
      POSTGRES_DB: blackbeard
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbeard -d blackbeard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [backend]

  # ── Valkey (Redis-compatible cache) ────────────────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["valkey-server", "--requirepass", "valkey-dev-secret", "--maxmemory", "256mb"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=valkey-dev-secret valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks: [backend]

  # ── LiteLLM Proxy ─────────────────────────────────────────────────────────
  litellm:
    image: litellm/litellm:main-v1.83.3-stable.patch.3
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DATABASE_URL: postgresql://blackbeard:blackbeard@postgres:5432/litellm
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml
      - ${GOOGLE_APPLICATION_CREDENTIALS:-deploy/docker/empty-credentials.json}:/app/credentials.json:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; r=urllib.request.Request('http://localhost:4000/health/liveliness'); urllib.request.urlopen(r)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [backend]

volumes:
  pgdata:

networks:
  frontend:
  backend:
