x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── API (FastAPI backend) ──────────────────────────────────────────────────
  api:
    build:
      context: backend/
      dockerfile: ../deploy/docker/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackbeard:blackbeard@postgres:5432/blackbeard}
      VALKEY_URL: ${VALKEY_URL:-valkey://default:valkey-dev-secret@valkey:6379/0}
      LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      BLACKBEARD_API_KEY: ${BLACKBEARD_API_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-jwt-secret-in-production}
      DEBUG: ${DEBUG:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-deploy/docker/empty-credentials.json}:/app/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [frontend, backend]

  # ── UI (React/Vite frontend) ───────────────────────────────────────────────
  ui:
    build:
      context: frontend/
      dockerfile: ../deploy/docker/Dockerfile.ui
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks: [frontend]

  # ── PostgreSQL 18 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackbeard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackbeard}
      POSTGRES_DB: ${POSTGRES_DB:-blackbeard}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
      - "-c"
      - "idle_in_transaction_session_timeout=300000"
      - "-c"
      - "statement_timeout=300000"
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackbeard} -d ${POSTGRES_DB:-blackbeard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [backend]

  # ── Valkey (Redis-compatible cache) ────────────────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-valkey-dev-secret}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60 1000", "--save", "300 100"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${VALKEY_PASSWORD:-valkey-dev-secret} valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks: [backend]

  # ── LiteLLM Proxy ─────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:1.84.0
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://blackbeard:blackbeard@postgres:5432/litellm}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-deploy/docker/empty-credentials.json}:/app/credentials.json:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveness')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [backend]

volumes:
  pgdata:
  valkeydata:

networks:
  frontend:
  backend:
