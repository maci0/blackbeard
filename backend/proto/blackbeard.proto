syntax = "proto3";

package blackbeard.v1;

service BlackbeardService {
    rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
    rpc GetResource(GetResourceRequest) returns (Resource);
    rpc CreateResource(CreateResourceRequest) returns (Resource);
    rpc DeleteResource(DeleteResourceRequest) returns (DeleteResponse);
    rpc Kickoff(KickoffRequest) returns (Execution);
    rpc GetExecution(GetExecutionRequest) returns (Execution);
    rpc StreamEvents(StreamEventsRequest) returns (stream ExecutionEvent);
    rpc Health(HealthRequest) returns (HealthResponse);
}

message Resource {
    string id = 1;
    string api_version = 2;
    string kind = 3;
    string name = 4;
    string project = 5;
    string spec_json = 6;
    int32 version = 7;
    string created_at = 8;
    string updated_at = 9;
}

message ListResourcesRequest {
    string kind = 1;
    string project = 2;
    int32 limit = 3;
    int32 offset = 4;
}

message ListResourcesResponse {
    repeated Resource items = 1;
    int32 total = 2;
}

message GetResourceRequest {
    string kind = 1;
    string name = 2;
    string project = 3;
}

message CreateResourceRequest {
    string api_version = 1;
    string kind = 2;
    string name = 3;
    string project = 4;
    string spec_json = 5;
}

message DeleteResourceRequest {
    string kind = 1;
    string name = 2;
    string project = 3;
}

message DeleteResponse {
    bool deleted = 1;
}

message KickoffRequest {
    string crew_name = 1;
    string project = 2;
    string inputs_json = 3;
}

message Execution {
    string id = 1;
    string crew_name = 2;
    string project = 3;
    string status = 4;
    string execution_type = 5;
    string inputs_json = 6;
    string outputs_json = 7;
    string error = 8;
    int64 total_tokens = 9;
    string created_at = 10;
    string started_at = 11;
    string completed_at = 12;
}

message GetExecutionRequest {
    string execution_id = 1;
}

message StreamEventsRequest {
    string execution_id = 1;
    int32 after_sequence = 2;
}

message ExecutionEvent {
    int32 sequence = 1;
    string event_type = 2;
    string timestamp = 3;
    string data_json = 4;
}

message HealthRequest {}

message HealthResponse {
    string status = 1;
    string version = 2;
}
