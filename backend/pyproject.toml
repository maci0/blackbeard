[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbeard"
version = "0.1.0"
description = "Open, self-hosted Agent Management Platform wrapping CrewAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    # valkey health checks use redis.asyncio (wire-compatible); no valkey package needed
    "crewai>=1.14,<2",
    "wasmtime>=42,<43",
    "click>=8.1,<9",
    "rich>=14.0,<15",
    "pyyaml>=6.0,<7",
    "sse-starlette>=2.2,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "crewai-tools>=1.14.4",
    "crewai-files>=1.14.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.1,<7",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6.0.12,<7",
    "aiosqlite>=0.20,<1",
]

[project.scripts]
blackbeard = "blackbeard.cli.__main__:cli"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W",   # core
    "UP",                        # pyupgrade
    "B",                         # bugbear
    "SIM",                       # simplify
    "ANN",                       # annotations
    "RUF",                       # ruff-specific
    "PT",                        # pytest style
    "C4",                        # comprehensions
    "PIE",                       # misc
    "T20",                       # no print
    "TCH",                       # type-checking imports
]
ignore = [
    "ANN401",   # Any in signatures — needed for crewai untyped APIs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E402"]
"alembic/**" = ["ANN", "UP", "E501", "I", "F401"]
"blackbeard/api/**" = ["B008", "TCH"]  # FastAPI needs types at runtime
"blackbeard/models/resource_schemas.py" = ["N815"]  # apiVersion is API contract
"blackbeard/resources/refs.py" = ["N806"]  # WHITE/GRAY/BLACK graph constants

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
