[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbeard"
version = "0.1.0"
description = "Open, self-hosted Agent Management Platform wrapping CrewAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "crewai>=1.14,<2",
    "redis>=5.0,<7",  # health.py uses redis.asyncio for Valkey health checks (wire-compatible)
    "wasmtime>=44,<45",  # 42.0.0 has CVE-2026-44216/34941..34946 (no Python patch release; 43.0.0 has CVE-2026-34983)
    "pyyaml>=6.0,<7",
    "sse-starlette>=2.2,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "crewai-tools>=1.14.4,<2",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.3,<5",
    "email-validator>=2.2,<3",
]

[tool.uv]
constraint-dependencies = [
    "pillow>=12.2.0",  # CVE-2026-40192, CVE-2026-42308..42311 (transitive via crewai)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",  # 9.0.3 fixes CVE-2025-71176 (tmpdir privilege escalation)
    "pytest-asyncio>=1.0,<2",  # 1.x supports pytest 9
    "pytest-cov>=6.1,<7",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6.0.12,<7",
    "aiosqlite>=0.20,<1",
    "pip-audit>=2.9,<3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W",   # core
    "UP",                        # pyupgrade
    "B",                         # bugbear
    "SIM",                       # simplify
    "ANN",                       # annotations
    "RUF",                       # ruff-specific
    "PT",                        # pytest style
    "C4",                        # comprehensions
    "PIE",                       # misc
    "T20",                       # no print
    "TCH",                       # type-checking imports
]
ignore = [
    "ANN401",   # Any in signatures — needed for crewai untyped APIs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E402", "PT011", "B017", "TC002", "E501"]
"alembic/**" = ["ANN", "UP", "E501", "I", "F401"]
"blackbeard/api/**" = ["B008", "TCH", "PT"]  # FastAPI needs types at runtime; test_crew endpoint is not a pytest test
"blackbeard/auth/**" = ["B008", "TCH"]  # FastAPI dependencies need types at runtime
"blackbeard/models/resource_schemas.py" = ["N815"]  # apiVersion is API contract
"blackbeard/engine/executor.py" = ["PT"]  # test_crew is not a pytest test
"blackbeard/resources/refs.py" = ["N806"]  # WHITE/GRAY/BLACK graph constants

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
