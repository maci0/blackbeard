[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbeard"
version = "0.1.0"
description = "Open, self-hosted Agent Management Platform wrapping CrewAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    # valkey — add back when caching layer is implemented
    "crewai>=0.108,<1",
    "langfuse>=2.60,<3",
    "wasmtime>=28,<30",
    "click>=8.1,<9",
    "rich>=13.0,<14",
    "pyyaml>=6.0,<7",
    "sse-starlette>=2.0,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "aiosqlite>=0.20,<1",
]

[project.scripts]
blackbeard = "blackbeard.cli.__main__:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
