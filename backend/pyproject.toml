[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "blackbeard"
version = "0.4.0"
description = "Open, self-hosted Agent Management Platform wrapping CrewAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<1",
    "starlette>=1.3.1,<2",  # imported directly (middleware, OIDC, health); floor: PYSEC-2026-248/249
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "crewai>=1.14.6,<2",
    "redis>=5.0,<7",  # health.py uses redis.asyncio for Valkey health checks (wire-compatible)
    "wasmtime>=48.0.0,<49",  # 42/43/44 have no patched Python releases: 42.0.0 CVE-2026-44216/34941..34946, 43.0.0 CVE-2026-34983, 44.0.0 misses GHSA-p8xm-42r7-89xg / 2r75-cxrj-cmph / 3p27-qvp9-27qf (fixed in core 44.0.1-.3 but never published on PyPI); 45.x carries all fixes
    "pyyaml>=6.0,<7",
    "sse-starlette>=2.2,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "croniter>=2.0,<3",
    "crewai-tools>=1.14.5,<2",
    "pyjwt>=2.13.0,<3",  # GHSA-jq35-7prp-9v3f / PYSEC-2026-175..179
    "bcrypt>=4.3,<5",
    "email-validator>=2.2,<3",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "authlib>=1.7.2,<2",
    "itsdangerous>=2.2,<3",
    "prometheus-client>=0.21,<1",
]

[tool.uv]
constraint-dependencies = [
    "pillow>=12.3.0",  # PYSEC-2026-2253..2257, 3451..3454, 3493..3496 (transitive via crewai)
    "aiohttp>=3.14.3",  # GHSA-cq5v-8q36-5273 / mq44-7p77 / mfx4-hv73 (transitive)
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5 and related (transitive via joserfc/authlib)
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 (transitive)
    "json-repair>=0.60.1",  # GHSA-xf7x-x43h-rpqh (transitive via crewai)
    "joserfc>=1.6.8",  # PYSEC-2026-2528, PYSEC-2026-2530 (transitive)
    "mcp>=1.28.1",  # PYSEC-2026-3481..3483 (transitive via crewai)
    "python-multipart>=0.0.31",  # PYSEC-2026-3036, 3037, 3040 (transitive via fastapi)
    "soupsieve>=2.8.4",  # PYSEC-2026-3071, PYSEC-2026-3072 (transitive)
    "click>=8.3.3",  # PYSEC-2026-2132 (transitive via crewai/typer)
    "setuptools>=83.0.0",  # PYSEC-2026-3447 (transitive via spacy/thinc)
    "uv>=0.11.15",  # GHSA-4gg8-gxpx-9rph (transitive via crewai-cli)
    "pip>=26.1.2",  # PYSEC-2026-196 (dev transitive via pip-audit)
    # chromadb: CVE-2026-45829 (GHSA-f4j7-r4q5-qw2c) critical pre-auth RCE and PYSEC-2026-311,
    # NO FIX available as of 2026-08-26 (checked OSV against chromadb 1.5.9); transitive via crewai,
    # monitor https://github.com/chroma-core/chroma for patch release
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",  # 9.0.3 fixes CVE-2025-71176 (tmpdir privilege escalation)
    "pytest-asyncio>=1.0,<2",  # 1.x supports pytest 9
    "pytest-cov>=6.1,<7",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6.0.12,<7",
    "types-croniter>=6.0,<7",
    "aiosqlite>=0.20,<1",
    "pip-audit>=2.9,<3",
    "hypothesis>=6.100,<7",
    "bandit[toml]>=1.8,<2",
    "pytest-timeout>=2.3,<3",
]
temporal = [
    "temporalio>=1.9,<2",
]
muninn = [
    "muninn-python>=0.1,<1",
]
otel = [
    # Imported lazily (guarded by try/except ImportError) when OTEL_ENDPOINT is set
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]
load = [
    # tests/load/locustfile.py: ad-hoc API load testing against a running stack
    "locust>=2.30,<3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W",   # core
    "UP",                        # pyupgrade
    "B",                         # bugbear
    "SIM",                       # simplify
    "ANN",                       # annotations
    "RUF",                       # ruff-specific
    "PT",                        # pytest style
    "C4",                        # comprehensions
    "PIE",                       # misc
    "T20",                       # no print
    "TCH",                       # type-checking imports
    "DTZ",                       # naive datetimes compare/marshal incorrectly
    "ISC",                       # implicit string concat hides missing commas
]
ignore = [
    "ANN401",   # Any in signatures: needed for crewai untyped APIs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E402", "PT011", "PT018", "B017", "TC002", "E501", "SIM117"]
"alembic/**" = ["ANN", "UP", "E501", "I", "F401"]
"blackbeard/api/**" = ["B008", "TCH", "PT"]  # FastAPI needs types at runtime; test_crew endpoint is not a pytest test
"blackbeard/auth/**" = ["B008", "TCH"]  # FastAPI dependencies need types at runtime
"blackbeard/models/resource_schemas.py" = ["N815"]  # apiVersion is API contract
"blackbeard/engine/executor.py" = ["PT"]  # test_crew is not a pytest test
"blackbeard/resources/refs.py" = ["N806"]  # WHITE/GRAY/BLACK graph constants

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert is fine in non-test code for this project

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "blackbeard.engine.temporal"
# temporalio is an optional dependency; conditional imports produce
# unresolvable type-ignore noise depending on install state.
warn_unused_ignores = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Fail fast on stuck tests (e.g. WebSocket teardown / network waits) so CI
# jobs do not sit until the full job timeout.
timeout = 120
timeout_method = "thread"

