## Blackbeard Tools Library — curated tool catalog
## Each entry becomes installable via POST /api/v1/tools/library/install

- slug: web-search
  name: Web Search
  description: Search the web using DuckDuckGo or Google. Returns top results with titles, URLs, and snippets.
  category: web
  type: python
  class_path: crewai_tools.SerperDevTool
  sandbox: none
  tags: [search, web, research]

- slug: web-scraper
  name: Website Scraper
  description: Scrape and extract content from any website URL. Returns clean text or structured data.
  category: web
  type: python
  class_path: crewai_tools.ScrapeWebsiteTool
  sandbox: none
  tags: [web, scrape, extract]

- slug: http-request
  name: HTTP Request
  description: Make HTTP requests to APIs and web services. Supports GET, POST, PUT, DELETE with headers and body.
  category: web
  type: python
  class_path: crewai_tools.ScrapeWebsiteTool
  sandbox: none
  tags: [http, api, request]

- slug: csv-reader
