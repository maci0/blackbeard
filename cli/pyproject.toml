[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbeard-cli"
version = "0.1.0"
description = "CLI for Blackbeard Agent Management Platform"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.28,<1",
    "rich>=14.0,<15",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "pytest>=9.0,<10",
]

[project.scripts]
blackbeard = "blackbeard_cli.__main__:cli"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ANN", "RUF", "C4", "PIE", "T20", "TCH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"blackbeard_cli/exec.py" = ["PT"]
"blackbeard_cli/resources/refs.py" = ["N806"]
"tests/**" = ["ANN", "E402", "SIM300"]
