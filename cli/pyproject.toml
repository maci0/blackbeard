[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "blackbeard-cli"
version = "0.3.0"
description = "CLI for Blackbeard Agent Management Platform"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.28,<1",
    "prompt-toolkit>=3.0,<4",
    "rich>=14.0,<15",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "pytest>=9.0.3,<10",  # 9.0.3 fixes CVE-2025-71176 (tmpdir privilege escalation)
]

[project.scripts]
blackbeard = "blackbeard_cli.__main__:cli"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Mirrors backend/blackbeard's rule set (minus PT-specific per-file ignores there).
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ANN", "RUF", "C4", "PIE", "T20", "TCH", "DTZ", "ISC", "RSE", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"blackbeard_cli/exec.py" = ["PT"]
"blackbeard_cli/resources/refs.py" = ["N806"]
"blackbeard_cli/shell.py" = ["ANN401", "E402"]
"tests/**" = ["ANN", "E402", "SIM300"]
