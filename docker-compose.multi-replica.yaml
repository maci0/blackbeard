# Multi-replica deployment with nginx load balancer.
# Tests Valkey pub/sub fan-out for collaboration across API replicas.
#
# Usage:
#   podman-compose -f docker-compose.yaml -f docker-compose.multi-replica.yaml up -d
#
# This override:
#   - Removes the port mapping from the api service (nginx handles it)
#   - Adds a second API replica (api-2)
#   - Adds an nginx load balancer on port 8000
#   - UI proxies to the load balancer instead of a single API instance

services:
  api:
    ports: []

  api-2:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://blackbeard:${POSTGRES_PASSWORD:-blackbeard}@postgres:5432/blackbeard"
      VALKEY_URL: "valkey://default:${VALKEY_PASSWORD:-valkey-dev-secret}@valkey:6379/0"
      LITELLM_PROXY_URL: "http://litellm:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      BLACKBEARD_API_KEY: ${BLACKBEARD_API_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-jwt-secret-in-production!}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    tmpfs:
      - /tmp:size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [frontend, backend]

  api-lb:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-2
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks: [frontend, backend]

  ui:
    environment:
      API_UPSTREAM: "api-lb:8000"
