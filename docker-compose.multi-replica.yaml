# Multi-replica deployment with nginx load balancer.
# Tests Valkey pub/sub fan-out for collaboration across API replicas.
#
# Usage:
#   podman-compose -f docker-compose.yaml -f docker-compose.multi-replica.yaml up -d
#
# This override:
#   - Removes the port mapping from the api service (nginx handles it)
#   - Adds a second API replica (api-2)
#   - Adds an nginx load balancer on port 8000
#   - UI proxies to the load balancer instead of a single API instance

services:
  api:
    ports: []

  api-2:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.api
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackbeard:blackbeard@postgres:5432/blackbeard}
      VALKEY_URL: ${VALKEY_URL:-valkey://default:valkey-dev-secret@valkey:6379/0}
      LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      BLACKBEARD_API_KEY: ${BLACKBEARD_API_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-jwt-secret-in-production!}
      DEBUG: ${DEBUG:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ./examples:/app/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    tmpfs:
      - /tmp:size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [frontend, backend]

  api-lb:
    # Unprivileged variant: runs as uid 101, needs no added capabilities
    # (port 8000 is non-privileged; pid/cache paths live in /tmp).
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [frontend, backend]

  ui:
    environment:
      API_UPSTREAM: "api-lb:8000"
