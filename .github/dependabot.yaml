version: 2

updates:
  # Python (backend)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    groups:
      python-minor:
        update-types: [minor, patch]

  # npm/bun (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    groups:
      js-minor:
        update-types: [minor, patch]

  # Python (CLI)
  - package-ecosystem: pip
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-minor:
        update-types: [minor, patch]

  # Python (SDK)
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-minor:
        update-types: [minor, patch]

  # npm/bun (TypeScript SDK)
  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      js-minor:
        update-types: [minor, patch]

  # npm/bun (React SDK)
  - package-ecosystem: npm
    directory: /sdks/react
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      js-minor:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions-minor:
        update-types: [minor, patch]

  # Docker (Dockerfiles)
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    groups:
      docker-minor:
        update-types: [minor, patch]

  # Docker Compose (service images)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    groups:
      docker-minor:
        update-types: [minor, patch]
