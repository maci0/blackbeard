name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Patch-pin to match deploy/docker/Dockerfile.api (python:3.13.14-slim).
  PYTHON_VERSION: "3.13.14"
  UV_VERSION: "0.11.15"
  BUN_VERSION: "1.2.17"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Coverage + full suite (incl. hypothesis) needs headroom on GHA runners.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy blackbeard/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: uv run bandit -r blackbeard/ -c pyproject.toml

      - name: Test
        run: uv run pytest --cov=blackbeard --cov-report=term-missing --cov-fail-under=60

      - name: Audit dependencies
        id: pip-audit
        run: uv run pip-audit --strict --desc
        timeout-minutes: 3
        continue-on-error: true

      - name: Warn on dependency vulnerabilities
        if: steps.pip-audit.outcome == 'failure'
        run: echo "::warning::pip-audit found dependency vulnerabilities, review the Audit dependencies step output"

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "cli/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy blackbeard_cli/ --ignore-missing-imports

      - name: Verify CLI loads
        run: uv run blackbeard --help

      - name: Verify offline validation
        run: uv run blackbeard validate -f ../examples/research-crew/

  sdk-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "sdks/python/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest tests/ -x

  sdk-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('sdks/typescript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

  sdk-react:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdks/react
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('sdks/react/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

  # README promises backend, CLI, SDKs, and frontend share one version and
  # release together; fail fast if any manifest drifts.
  version-lockstep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: All manifests declare the same version
        run: |
          toml() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1"; }
          # Trailing comma optional so JSON package.json stays flexible.
          json() { sed -n 's/^  "version": "\([^"]*\)",\?$/\1/p' "$1"; }
          chart() { sed -n 's/^version: \(.*\)$/\1/p' "$1" | head -1; }
          chart_app() { sed -n 's/^appVersion: "\(.*\)"$/\1/p' "$1"; }
          versions=$(
            toml backend/pyproject.toml
            toml cli/pyproject.toml
            toml sdks/python/pyproject.toml
            json frontend/package.json
            json sdks/typescript/package.json
            json sdks/react/package.json
            chart deploy/helm/blackbeard/Chart.yaml
            chart_app deploy/helm/blackbeard/Chart.yaml
          )
          echo "$versions"
          [ "$(echo "$versions" | wc -l)" -eq 8 ] || { echo "expected 8 versions"; exit 1; }
          [ "$(echo "$versions" | sort -u | wc -l)" -eq 1 ] || { echo "version drift between manifests"; exit 1; }

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: "v3.17.3"

      - name: Lint Helm chart
        run: >
          helm lint deploy/helm/blackbeard/ --strict
          --set auth.apiKey=lint-test
          --set auth.jwtSecret=lint-test
          --set auth.litellmMasterKey=lint-test
          --set database.password=lint-test
          --set valkeyPassword=lint-test

      - name: Render Helm templates
        run: >
          helm template blackbeard deploy/helm/blackbeard/ --debug
          --set auth.apiKey=lint-test-key-32chars-minimum!!
          --set auth.jwtSecret=lint-test-jwt-secret-32chars-min
          --set auth.litellmMasterKey=lint-test-litellm-master-key
          --set database.password=lint-test-db-password
          --set valkeyPassword=lint-test-valkey-password
          >/dev/null

      - name: Render Helm templates (existingSecret)
        run: >
          helm template blackbeard deploy/helm/blackbeard/ --debug
          --set existingSecret=my-external-secrets
          >/dev/null

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test -- --run

      - name: Build
        run: bun run build

  docker-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH from commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: deploy/docker/Dockerfile.api
          push: false
          load: true
          tags: blackbeard-api:${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Cache Trivy DB
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/trivy
          # Per-run key so the updated DB is saved after each run; restore-keys
          # pulls the most recent one (a static key would freeze the first DB forever).
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: blackbeard-api:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy

  docker-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH from commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build UI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: deploy/docker/Dockerfile.ui
          push: false
          load: true
          tags: blackbeard-ui:${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Cache Trivy DB
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/trivy
          # Per-run key so the updated DB is saved after each run; restore-keys
          # pulls the most recent one (a static key would freeze the first DB forever).
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan UI image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: blackbeard-ui:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy

  sbom:
    # CycloneDX inventory of the resolved backend dependency tree, derived from
    # uv.lock (not the manifest) so it reflects exactly what ships. Informational:
    # kept out of ci-gate so registry/tool hiccups cannot block PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Export resolved requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-sbom.txt

      - name: Generate CycloneDX SBOM
        run: uvx cyclonedx-py requirements -i requirements-sbom.txt --format json --output-file sbom-backend.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-backend-cyclonedx
          path: backend/sbom-backend.cdx.json

  ci-gate:
    if: always()
    needs: [backend, cli, sdk-python, sdk-typescript, sdk-react, version-lockstep, helm-lint, frontend, docker-api, docker-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: All jobs passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All CI jobs passed"
      - name: Some jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
