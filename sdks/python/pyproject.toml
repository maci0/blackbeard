[project]
name = "blackbeard-sdk"
version = "0.4.0"
description = "Python SDK for the Blackbeard Agent Management Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",  # 9.0.3 fixes CVE-2025-71176 (tmpdir privilege escalation)
    "pyyaml>=6.0,<7",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackbeard_sdk"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Mirrors backend/blackbeard and cli/blackbeard_cli rule sets. target-version
# is derived from requires-python (3.10).
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ANN", "RUF", "C4", "PIE", "T20", "TCH", "DTZ", "ISC", "RSE", "PT"]
ignore = [
    "ANN401",  # Any in signatures: HTTP payloads are dynamically shaped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PT011", "PT018", "B017", "TC002", "SIM117"]
