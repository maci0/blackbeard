# Temporal workflow engine overlay for development.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.temporal.yaml up
#
# This adds a Temporal server (with auto-setup) and the Temporal web UI,
# and injects the TEMPORAL_HOST env var into the Blackbeard API service so
# crew executions are dispatched as Temporal workflows instead of running
# in the local ThreadPoolExecutor.

services:

  # Override the API service to point at the Temporal server
  api:
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: blackbeard
      TEMPORAL_TASK_QUEUE: crew-execution
    depends_on:
      temporal:
        condition: service_healthy

  # Temporal server with auto-setup (creates namespace on first start)
  temporal:
    image: temporalio/auto-setup:1.29.6
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      DB: sqlite
      TEMPORAL_BROADCAST_ADDRESS: 0.0.0.0
      TEMPORAL_CLI_NAMESPACE: blackbeard
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "tctl", "--ns", "blackbeard", "namespace", "describe"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

  # Temporal web UI for workflow visibility
  temporal-ui:
    image: temporalio/ui:2.49.1
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]
