groups:
  - name: blackbeard
    rules:
      # API health
      - alert: APIDown
        expr: up{job="blackbeard-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Blackbeard API is down"
          description: "API has been unreachable for more than 1 minute."
          runbook: "Check api container logs, readiness (/api/v1/health/ready), and Postgres connectivity."

      - alert: APIHighLatency
        # Histogram-based p95 (matches http_request_duration_seconds_* buckets).
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="blackbeard-api"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 2s"
          description: "95th percentile request latency has been above 2 seconds for 5 minutes."
          runbook: "Check LiteLLM latency, DB pool saturation, and blackbeard_executor_queued_tasks."

      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="blackbeard-api", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="blackbeard-api"}[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API error rate above 5%"
          description: "More than 5% of requests are returning 5xx errors."
          runbook: "Filter logs by event=unhandled_exception or http_status>=500; check request_id on failing paths."

      # Executor / crew runs
      - alert: ExecutorSaturated
        expr: blackbeard_executor_saturated{job="blackbeard-api"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Crew executor pool is saturated"
          description: "All executor workers are busy and the queue is non-empty for 5 minutes."
          runbook: "Increase MAX_CONCURRENT_EXECUTIONS, inspect long-running crews, or scale API replicas."

      - alert: ExecutionHighFailureRate
        expr: |
          (
            sum(rate(blackbeard_executions_total{job="blackbeard-api", status="failed"}[15m]))
            /
            clamp_min(sum(rate(blackbeard_executions_total{job="blackbeard-api"}[15m])), 1e-9)
          ) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Crew execution failure rate above 25%"
          description: "More than a quarter of executions failed over the last 15 minutes."
          runbook: "Check LiteLLM/provider health, AgentPolicy budgets, and recent execution error events."

      # LiteLLM
      - alert: LiteLLMDown
        expr: up{job="litellm"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LiteLLM proxy is down"
          description: "LiteLLM has been unreachable for more than 1 minute. No LLM calls can be made."
          runbook: "Inspect litellm container; crew kickoffs will fail until the proxy is healthy."

      - alert: LiteLLMHighSpend
        expr: litellm_spend_total > 100
        labels:
          severity: warning
        annotations:
          summary: "LiteLLM total spend above $100"
          description: "Total LLM spend has exceeded $100. Review budget policies."
          runbook: "Review AgentPolicy max_usd and LiteLLM virtual keys for runaway crews."

      # Database
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "Database has been unreachable for more than 1 minute."
          runbook: "API readiness will return 503; restore Postgres before traffic will succeed."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count above 80"
          description: "High number of database connections. Consider adding connection pooling."
          runbook: "Check API replica count vs pool size and long-lived sessions."

      - alert: PostgresDiskUsage
        expr: pg_database_size_bytes{datname="blackbeard"} > 5e9
        labels:
          severity: warning
        annotations:
          summary: "Database size above 5GB"
          description: "Blackbeard database is growing large. Consider archiving old executions."
          runbook: "Enable execution/audit retention (EXECUTION_RETENTION_DAYS / AUDIT_LOG_RETENTION_DAYS)."

      # Valkey
      - alert: ValkeyDown
        expr: up{job="valkey"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Valkey is down"
          description: "Valkey is unreachable. Live collaboration and multi-replica broadcasting will not work."
          runbook: "Collaboration WebSockets degrade; core API/crews can continue if DB is up."

      - alert: ValkeyHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Valkey memory usage above 90%"
          description: "Valkey is running low on memory."
          runbook: "Raise maxmemory or reduce collaboration fan-out payload retention."
