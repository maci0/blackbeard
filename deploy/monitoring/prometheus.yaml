global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yaml"

scrape_configs:
  - job_name: "blackbeard-api"
    metrics_path: /api/v1/health
    scheme: http
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: blackbeard-api

  - job_name: "litellm"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["litellm:4000"]
        labels:
          service: litellm

  - job_name: "postgres"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: "valkey"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["valkey-exporter:9121"]
        labels:
          service: valkey
