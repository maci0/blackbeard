apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbeard.fullname" . }}-api
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "blackbeard.selectorLabels" (dict "context" . "component" "ui") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
    {{- if .Values.ingress.enabled }}
    - from: []
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbeard.fullname" . }}-ui
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "ui") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 3000
---
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbeard.fullname" . }}-postgres
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "blackbeard.selectorLabels" (dict "context" . "component" "litellm") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
---
{{- if .Values.valkey.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbeard.fullname" . }}-valkey
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "valkey") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
  egress: []
{{- end }}
---
{{- if .Values.litellm.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbeard.fullname" . }}-litellm
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "litellm") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4000
{{- end }}
