apiVersion: v1
kind: Service
metadata:
  name: {{ include "blackbeard.fullname" . }}-ui
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "ui") | nindent 4 }}
