apiVersion: v1
kind: Pod
metadata:
  name: {{ include "blackbeard.fullname" . }}-test-connection
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 60
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api-health
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: "16Mi"
          cpu: "50m"
        limits:
          memory: "32Mi"
          cpu: "100m"
      command: ["sh", "-c"]
      args:
        - |
          echo "Testing UI endpoint..."
          wget -qO- --timeout=10 --spider http://{{ include "blackbeard.fullname" . }}-ui:{{ .Values.ui.service.port }}/ || exit 1
          echo ""
          echo "Testing API health via UI proxy..."
          wget -qO- --timeout=10 http://{{ include "blackbeard.fullname" . }}-ui:{{ .Values.ui.service.port }}/api/v1/health || exit 1
          echo ""
          echo "All connectivity tests passed."
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 1Mi
  restartPolicy: Never
