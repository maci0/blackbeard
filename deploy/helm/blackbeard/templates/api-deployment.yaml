apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blackbeard.fullname" . }}-api
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blackbeard.labels" . | nindent 8 }}
        {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "api") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: {{ include "blackbeard.apiImage" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blackbeard.secretsName" . }}
                  key: database-password
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blackbeard.secretsName" . }}
                  key: valkey-password
            - name: DATABASE_URL
              value: {{ include "blackbeard.databaseUrl" . | quote }}
            - name: VALKEY_URL
              value: {{ include "blackbeard.valkeyUrl" . | quote }}
            - name: LITELLM_PROXY_URL
              value: "http://{{ include "blackbeard.litellmHost" . }}:{{ .Values.litellm.service.port }}"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "blackbeard.secretsName" . }}
                  key: litellm-master-key
            - name: BLACKBEARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "blackbeard.secretsName" . }}
                  key: api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "blackbeard.secretsName" . }}
                  key: jwt-secret
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: home
          emptyDir:
            sizeLimit: 200Mi
