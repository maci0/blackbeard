{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blackbeard.fullname" . }}-postgres
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "blackbeard.fullname" . }}-postgres
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "blackbeard.selectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blackbeard.labels" . | nindent 8 }}
        {{- include "blackbeard.selectorLabels" (dict "context" . "component" "postgres") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blackbeard.secretsName" . }}
                  key: database-password
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - "postgres"
            - "-c"
            - "max_connections={{ .Values.postgres.config.maxConnections }}"
            - "-c"
            - "shared_buffers={{ .Values.postgres.config.sharedBuffers }}"
            - "-c"
            - "work_mem={{ .Values.postgres.config.workMem }}"
            - "-c"
            - "maintenance_work_mem={{ .Values.postgres.config.maintenanceWorkMem }}"
            - "-c"
            - "effective_cache_size={{ .Values.postgres.config.effectiveCacheSize }}"
            - "-c"
            - "random_page_cost={{ .Values.postgres.config.randomPageCost }}"
            - "-c"
            - "checkpoint_completion_target={{ .Values.postgres.config.checkpointCompletionTarget }}"
            - "-c"
            - "wal_buffers={{ .Values.postgres.config.walBuffers }}"
            - "-c"
            - "default_statistics_target={{ .Values.postgres.config.defaultStatisticsTarget }}"
            - "-c"
            - "log_min_duration_statement={{ .Values.postgres.config.logMinDurationStatement }}"
            - "-c"
            - "log_checkpoints=on"
            - "-c"
            - "log_connections=on"
            - "-c"
            - "log_disconnections=on"
            - "-c"
            - "log_lock_waits=on"
            - "-c"
            - "log_temp_files=0"
            - "-c"
            - "idle_in_transaction_session_timeout={{ .Values.postgres.config.idleInTransactionSessionTimeout }}"
            - "-c"
            - "statement_timeout={{ .Values.postgres.config.statementTimeout }}"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - {{ .Values.database.user | quote }}
                - "-d"
                - {{ .Values.database.name | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - {{ .Values.database.user | quote }}
                - "-d"
                - {{ .Values.database.name | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.shmSize }}
        - name: initdb
          configMap:
            name: {{ include "blackbeard.configmapName" . }}
            items:
              - key: create-databases.sql
                path: create-databases.sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storage.storageClass }}
        storageClassName: {{ .Values.postgres.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
