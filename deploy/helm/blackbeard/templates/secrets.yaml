apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blackbeard.secretsName" . }}
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "auth.apiKey is required" .Values.auth.apiKey | quote }}
  jwt-secret: {{ required "auth.jwtSecret is required" .Values.auth.jwtSecret | quote }}
  litellm-master-key: {{ required "auth.litellmMasterKey is required" .Values.auth.litellmMasterKey | quote }}
  database-password: {{ required "database.password is required" .Values.database.password | quote }}
  valkey-password: {{ required "valkeyPassword is required" .Values.valkeyPassword | quote }}
