{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blackbeard.secretsName" . }}
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "auth.apiKey is required (or set existingSecret)" .Values.auth.apiKey | quote }}
  jwt-secret: {{ required "auth.jwtSecret is required (or set existingSecret)" .Values.auth.jwtSecret | quote }}
  litellm-master-key: {{ required "auth.litellmMasterKey is required (or set existingSecret)" .Values.auth.litellmMasterKey | quote }}
  database-password: {{ required "database.password is required (or set existingSecret)" .Values.database.password | quote }}
  valkey-password: {{ required "valkeyPassword is required (or set existingSecret)" .Values.valkeyPassword | quote }}
{{- end }}
