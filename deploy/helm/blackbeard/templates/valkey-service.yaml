{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blackbeard.fullname" . }}-valkey
  labels:
    {{- include "blackbeard.labels" . | nindent 4 }}
    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "valkey") | nindent 4 }}
spec:
  type: {{ .Values.valkey.service.type }}
  ports:
    - port: {{ .Values.valkey.service.port }}
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    {{- include "blackbeard.selectorLabels" (dict "context" . "component" "valkey") | nindent 4 }}
{{- end }}
